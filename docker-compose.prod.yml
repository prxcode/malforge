# MAP — Production Docker Compose Overrides

services:
  # In production, we don't expose ports directly except for NGINX
  api:
    ports: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DEBUG=False

  db:
    ports: []
    
  redis:
    ports: []
    
  minio:
    ports: []

  # Add NGINX for production routing
  nginx:
    image: nginx:alpine
    container_name: map-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
