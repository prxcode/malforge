# =============================================================================
# MAP — Docker Compose (Development)
# =============================================================================

services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: map-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-map_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-map_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-map_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-map_user} -d ${POSTGRES_DB:-map_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: map-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- MinIO (Object Storage) ----------
  minio:
    image: minio/minio:latest
    container_name: map-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-map_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-map_minio_secret}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- MinIO Init (Create Bucket) ----------
  minio-init:
    image: minio/mc:latest
    container_name: map-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-map_minio_admin} $${MINIO_ROOT_PASSWORD:-map_minio_secret};
      mc mb --ignore-existing myminio/$${MINIO_BUCKET_SAMPLES:-map-samples};
      mc anonymous set download myminio/$${MINIO_BUCKET_SAMPLES:-map-samples};
      echo 'MinIO bucket initialized';
      "

  # ---------- FastAPI Backend ----------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: map-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sample_storage:/app/storage
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-map_user}:${POSTGRES_PASSWORD:-map_secret_password}@db:5432/${POSTGRES_DB:-map_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-map_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-map_minio_secret}
      - MINIO_BUCKET_SAMPLES=${MINIO_BUCKET_SAMPLES:-map-samples}
      - MINIO_USE_SSL=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STORAGE_PATH=/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------- Celery Worker ----------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: map-worker
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - sample_storage:/app/storage
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-map_user}:${POSTGRES_PASSWORD:-map_secret_password}@db:5432/${POSTGRES_DB:-map_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-map_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-map_minio_secret}
      - MINIO_BUCKET_SAMPLES=${MINIO_BUCKET_SAMPLES:-map-samples}
      - MINIO_USE_SSL=false
      - STORAGE_PATH=/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------- Flower (Celery Monitor) ----------
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: map-flower
    restart: unless-stopped
    command: celery -A app.worker flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  sample_storage:
