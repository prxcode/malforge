name: Feature request
description: Suggest a new heuristic, ATT&CK mapping, output format or other improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: For new heuristics or mappings, link the ATT&CK technique or a public write-up.
    validations:
      required: true
