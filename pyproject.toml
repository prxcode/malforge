[project]
name = "malforge"
version = "1.0.0"
description = "Detection Engineering Toolkit — Generate YARA, Sigma, MITRE ATT&CK mappings, IOC reports, and HTML reports from suspicious binaries."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Priyanshu", email = "prxcode@users.noreply.github.com" }]
readme = "README.md"
keywords = [
    "malware",
    "yara",
    "sigma",
    "detection-engineering",
    "threat-intelligence",
    "ioc",
    "mitre-attack",
    "cybersecurity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "pefile>=2024.8.26",
    "yara-python>=4.5.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
malforge = "malforge.cli:main"

[project.urls]
Homepage = "https://github.com/prxcode/malforge"
Repository = "https://github.com/prxcode/malforge"
Issues = "https://github.com/prxcode/malforge/issues"

[project.entry-points."malforge.plugins"]
# Third-party plugins register here, e.g.:
# my_plugin = "my_package:MyPlugin"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
malforge = ["report/templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "B904", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["malforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
