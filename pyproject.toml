[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "malforge"
dynamic = ["version"]
description = "Static analysis toolkit that turns a suspicious binary into YARA rules, Sigma rules, MITRE ATT&CK mappings and IOC reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Priyanshu", email = "prxcode@users.noreply.github.com" }]
keywords = [
    "malware",
    "malware-analysis",
    "yara",
    "sigma",
    "detection-engineering",
    "threat-intelligence",
    "ioc",
    "mitre-attack",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pefile>=2024.8.26",
    "rich>=13.0",
    "yara-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
malforge = "malforge.cli:main"

[project.urls]
Homepage = "https://github.com/prxcode/malforge"
Repository = "https://github.com/prxcode/malforge"
Issues = "https://github.com/prxcode/malforge/issues"
Changelog = "https://github.com/prxcode/malforge/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "malforge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
malforge = ["py.typed", "report/templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["malforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["malforge"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pefile", "yara"]
ignore_missing_imports = true
